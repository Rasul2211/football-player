<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#cold)"/>
  <!-- rain -->
  <g stroke="#7dd3fc" stroke-width="2" opacity="0.28" stroke-linecap="round">
    <path d="M60 30 L44 90"/><path d="M140 10 L124 70"/><path d="M220 50 L204 110"/>
    <path d="M300 0 L284 60"/><path d="M380 40 L364 100"/><path d="M460 16 L444 76"/>
    <path d="M540 56 L524 116"/><path d="M100 120 L84 180"/><path d="M340 140 L324 200"/>
    <path d="M500 150 L484 210"/>
  </g>
  <!-- bench -->
  <rect y="360" width="600" height="90" fill="#0f2b1c"/>
  <g fill="#334155">
    <rect x="130" y="300" width="340" height="22" rx="6"/>
    <rect x="130" y="332" width="340" height="16" rx="5"/>
    <rect x="160" y="322" width="16" height="60"/>
    <rect x="424" y="322" width="16" height="60"/>
  </g>
  <!-- seated player, head down -->
  <g fill="#0b1220">
    <path d="M262 300 L262 236 C262 214 278 200 300 200 C322 200 338 214 338 236 L338 300 Z"/>
    <circle cx="300" cy="186" r="26"/>
    <path d="M266 248 L232 300 L248 310 L280 262 Z"/>
    <path d="M334 248 L368 300 L352 310 L320 262 Z"/>
    <rect x="272" y="300" width="22" height="76" rx="6"/>
    <rect x="306" y="300" width="22" height="76" rx="6"/>
  </g>
  <!-- knee bandage -->
  <g>
    <rect x="266" y="322" width="34" height="30" rx="8" fill="#e2e8f0"/>
    <g stroke="#94a3b8" stroke-width="2">
      <path d="M266 330 L300 330"/><path d="M266 340 L300 340"/>
    </g>
  </g>
  <!-- crutch -->
  <g stroke="#64748b" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M440 250 L440 380"/><path d="M424 250 L456 250"/>
  </g>
  <!-- ball sitting still -->
  <g transform="translate(140 404)" opacity="0.85">
    <circle r="26" fill="#cbd5e1"/>
    <path d="M0 -13 L11 -5 L7 8 L-7 8 L-11 -5 Z" fill="#334155"/>
  </g>
</svg>
