<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2b1c"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1fae5a"/>
      <stop offset="100%" stop-color="#0d7a39"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a679"/>
      <stop offset="100%" stop-color="#b8815a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="720" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="260" fill="url(#halo)"/>

  <!-- big number watermark -->
  <text x="300" y="430" font-family="Arial Black, Arial, sans-serif" font-size="360"
        font-weight="900" fill="#ffffff" opacity="0.05" text-anchor="middle">10</text>

  <!-- shoulders / torso -->
  <path d="M300 372 C210 372 150 430 138 520 L128 720 L472 720 L462 520 C450 430 390 372 300 372 Z" fill="url(#kit)"/>
  <!-- collar -->
  <path d="M252 376 L300 424 L348 376 L330 366 L300 396 L270 366 Z" fill="#06371c"/>
  <!-- sleeve stripes -->
  <path d="M138 520 L128 720 L178 720 L186 522 Z" fill="#facc15" opacity="0.85"/>
  <path d="M462 520 L472 720 L422 720 L414 522 Z" fill="#facc15" opacity="0.85"/>
  <!-- jersey number -->
  <text x="300" y="640" font-family="Arial Black, Arial, sans-serif" font-size="150"
        font-weight="900" fill="#ffffff" opacity="0.92" text-anchor="middle">10</text>

  <!-- neck -->
  <path d="M268 318 L332 318 L332 392 L300 410 L268 392 Z" fill="#b8815a"/>
  <!-- head -->
  <ellipse cx="300" cy="248" rx="86" ry="100" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M214 244 C214 168 256 132 300 132 C344 132 386 168 386 244 C386 214 366 196 342 190
           C318 184 286 196 260 192 C236 188 220 210 214 244 Z" fill="#20160f"/>
  <!-- ears -->
  <ellipse cx="214" cy="256" rx="13" ry="20" fill="#c08a60"/>
  <ellipse cx="386" cy="256" rx="13" ry="20" fill="#c08a60"/>
  <!-- brows -->
  <path d="M254 232 q22 -12 44 -2" stroke="#20160f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M302 230 q22 -10 44 2" stroke="#20160f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="272" cy="256" rx="10" ry="7" fill="#1b1310"/>
  <ellipse cx="328" cy="256" rx="10" ry="7" fill="#1b1310"/>
  <!-- nose + mouth -->
  <path d="M300 266 L292 292 q8 6 16 0" stroke="#9c6b47" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M276 314 q24 16 48 0" stroke="#8d5b3c" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ball at bottom corner -->
  <g transform="translate(486 626)">
    <circle r="62" fill="#f8fafc"/>
    <circle r="62" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M0 -30 L26 -12 L17 20 L-17 20 L-26 -12 Z" fill="#111827"/>
    <g stroke="#111827" stroke-width="6" stroke-linecap="round">
      <path d="M0 -30 L0 -60"/><path d="M26 -12 L54 -22"/>
      <path d="M17 20 L34 46"/><path d="M-17 20 L-34 46"/><path d="M-26 -12 L-54 -22"/>
    </g>
  </g>
</svg>
