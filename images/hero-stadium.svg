<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="55%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b5e33"/>
      <stop offset="100%" stop-color="#0a2b18"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff9d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6c8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fdf6c8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="crowd" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#31425c" opacity="0.85"/>
      <circle cx="11" cy="10" r="2.1" fill="#3d5072" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stands -->
  <path d="M0 250 L1600 250 L1600 560 L0 560 Z" fill="#141f33"/>
  <path d="M0 270 L1600 270 L1600 545 L0 545 Z" fill="url(#crowd)"/>
  <path d="M0 250 L1600 250 L1600 285 L0 285 Z" fill="#0b1524"/>

  <!-- floodlight beams -->
  <path d="M180 120 L20 560 L420 560 Z" fill="url(#beam)"/>
  <path d="M1420 120 L1180 560 L1580 560 Z" fill="url(#beam)"/>
  <path d="M800 90 L560 560 L1040 560 Z" fill="url(#beam)" opacity="0.7"/>

  <!-- floodlight towers -->
  <g fill="#1c2942">
    <rect x="172" y="120" width="16" height="150"/>
    <rect x="120" y="86" width="120" height="44" rx="6"/>
    <rect x="1412" y="120" width="16" height="150"/>
    <rect x="1360" y="86" width="120" height="44" rx="6"/>
  </g>
  <circle cx="180" cy="108" r="95" fill="url(#lamp)"/>
  <circle cx="1420" cy="108" r="95" fill="url(#lamp)"/>
  <circle cx="800" cy="80" r="120" fill="url(#lamp)" opacity="0.55"/>

  <!-- pitch -->
  <path d="M0 560 L1600 560 L1600 900 L0 900 Z" fill="url(#pitch)"/>
  <g stroke="#ffffff" stroke-opacity="0.16" fill="none" stroke-width="3">
    <path d="M-60 640 L1660 640"/>
    <path d="M800 640 L800 900"/>
    <circle cx="800" cy="900" r="180"/>
    <path d="M330 900 L330 760 L1270 760 L1270 900"/>
  </g>
  <!-- mowing stripes -->
  <g fill="#ffffff" opacity="0.028">
    <rect x="0" y="560" width="1600" height="42"/>
    <rect x="0" y="644" width="1600" height="48"/>
    <rect x="0" y="740" width="1600" height="54"/>
    <rect x="0" y="848" width="1600" height="60"/>
  </g>

  <rect width="1600" height="900" fill="#050a16" opacity="0.35"/>
</svg>
